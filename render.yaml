services:
  - type: web
    name: rich-wind-core
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm run prod
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RW_CACHE_MAX_PAGES
        value: "200"
      - key: RW_CACHE_TTL_MS
        value: "600000"
      - key: RW_PROJECT_CACHE_TTL_MS
        value: "600000"
      - key: RW_MAX_BODY_BYTES
        value: "100000"
      - key: RW_MAX_HTML_CHARS
        value: "50000"
      - key: RW_MAX_CLASS_CHARS
        value: "10000"
      - key: RW_MAX_CLASS_COUNT
        value: "1500"
      - key: RW_MAX_ID_LENGTH
        value: "64"
      - key: RW_SUGGEST_LIMIT
        value: "50"
      - key: RW_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RW_RATE_LIMIT_MAX
        value: "60"

  - type: web
    name: rich-wind-ui
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace=demo
    startCommand: npm run preview --workspace=demo -- --host 0.0.0.0 --port $PORT
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_RW_CORE_URL
        fromService:
          type: web
          name: rich-wind-core
          envVarKey: RENDER_EXTERNAL_URL
