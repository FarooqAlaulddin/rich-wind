services:
  - type: web
    name: rich-wind
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=demo
    startCommand: node scripts/dev-server.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RW_CACHE_MAX_PAGES
        value: "200"
      - key: RW_CACHE_TTL_MS
        value: "600000"
      - key: RW_PROJECT_CACHE_TTL_MS
        value: "600000"
      - key: RW_MAX_BODY_BYTES
        value: "100000"
      - key: RW_MAX_HTML_CHARS
        value: "50000"
      - key: RW_MAX_CLASS_CHARS
        value: "10000"
      - key: RW_MAX_CLASS_COUNT
        value: "1500"
      - key: RW_MAX_ID_LENGTH
        value: "64"
      - key: RW_SUGGEST_LIMIT
        value: "50"
      - key: RW_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RW_RATE_LIMIT_MAX
        value: "60"
