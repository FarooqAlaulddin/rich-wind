<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rich Wind Demo</title>
  <meta name="description" content="Runtime Tailwind CSS compiler demo: type styled content, get compiled CSS live, see rejected classes." />
</head>
<body>
  <script>
    try {
      var t = localStorage.getItem('rw-lexical-theme');
      var d = t === 'dark' || (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (d) { document.documentElement.classList.add('theme-dark'); document.documentElement.style.colorScheme = 'dark'; }
    } catch(e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
