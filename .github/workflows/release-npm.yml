name: Release to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal package.json on main (e.g. 1.0.0-rc.1)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag used for publish
        required: true
        default: next
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc
          - next

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-npm-main
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish, and tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run package smoke test
        run: npm run test:pack

      - name: Build lexical demo production bundle
        run: npm run build:lexical-demo

      - name: Check version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail

          # The version is set in package.json by a normal pull request; this
          # input only confirms it, so the job never pushes to main.
          current="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$current" ]; then
            echo "package.json on main is $current, not $VERSION. Bump it in a pull request first."
            exit 1
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "Not a valid semver version: $VERSION"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi

          prerelease="false"
          if [[ "$VERSION" == *-* ]]; then
            prerelease="true"
            if [ "$DIST_TAG" = "latest" ]; then
              echo "Prerelease versions must not publish to the latest dist-tag."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # Reads the NPM_TOKEN repository secret (owner creates it; not in the repo).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          prerelease="${{ steps.version.outputs.prerelease }}"

          args=(release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes)
          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
