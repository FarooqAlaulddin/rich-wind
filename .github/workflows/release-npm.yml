name: Release to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release (semver, e.g. 1.0.0-rc.1 or 1.0.0)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag used for publish
        required: true
        default: next
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc
          - next

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-npm-main
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run package smoke test
        run: npm run test:pack

      - name: Build lexical demo production bundle
        run: npm run build:lexical-demo

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version and create tag
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "Not a valid semver version: $VERSION"
            exit 1
          fi

          prerelease="false"
          if [[ "$VERSION" == *-* ]]; then
            prerelease="true"
            if [ "$DIST_TAG" = "latest" ]; then
              echo "Prerelease versions must not publish to the latest dist-tag."
              exit 1
            fi
          fi

          npm version "$VERSION" -m "release: %s"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Publish to npm
        # Reads the NPM_TOKEN repository secret (owner creates it; not in the repo).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          prerelease="${{ steps.version.outputs.prerelease }}"

          args=(release create "v$version" --title "v$version" --generate-notes)
          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Merge main back into dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main dev
          git checkout -b dev origin/dev
          git merge --no-ff origin/main -m "Merge main into dev after release v${{ steps.version.outputs.version }}"
          git push origin dev
